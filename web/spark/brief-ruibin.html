<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruibin's Ideal Version</title>
<script>
  // Same theme cookie as the dashboard; it styles the page around the slide.
  // The slide itself is always white, on screen and in print.
  (function () {
    var m = document.cookie.match(/(?:^|;\s*)nomad_theme=(dark|light|contrast)/);
    if (m) document.documentElement.setAttribute('data-theme', m[1]);
    // ?embed is the dashboard showing the slide in a frame: the slide alone, edge to edge
    if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add('embed');
  })();
</script>
<!-- Libre Franklin stands in for the template's Franklin Gothic where that font is not installed. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap">
<style>
:root {
  --franklin: 'Franklin Gothic Book', 'Franklin Gothic Medium', 'Libre Franklin', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
  --page: #080909; --page-line: #20231f; --page-text: #f2f2ee; --page-btn: #131513; --page-btn-line: #333733;

  /* Slide tokens: docs/SLIDE_SCHEMA.md, verbatim. */
  --purple: #4f0f87; --teal: #35746e; --rust: #b34a22;
  --purple-tint: #f4f0f9; --teal-tint: #e8f2f1; --rust-tint: #fbf1eb; --rust-line: #ebcab6;
  --title: #3f3f3f; --ink: #262626; --sub: #5f5f5f; --wire: #8c8c8c; --rule: #7f7f7f;
  --card-line: #d8d2e2; --white: #ffffff;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]):not([data-theme="contrast"]) {
    --page: #f6f7f3; --page-line: #d5d9d3; --page-text: #121412; --page-btn: #eef0ec; --page-btn-line: #b7bdb6;
  }
}
[data-theme="light"] { --page: #f6f7f3; --page-line: #d5d9d3; --page-text: #121412; --page-btn: #eef0ec; --page-btn-line: #b7bdb6; }
[data-theme="contrast"] { --page: #000; --page-line: #8a8a8a; --page-text: #fff; --page-btn: #0a0a0a; --page-btn-line: #c0c0c0; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--page-text);
       font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }

.bar { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--page-line); flex-wrap: wrap; }
.bar .name { font-weight: 700; }
.bar .sp { flex: 1; }
.btn { display: inline-flex; align-items: center; padding: 6px 12px; border: 1px solid var(--page-btn-line);
       border-radius: 8px; background: var(--page-btn); color: var(--page-text); text-decoration: none; font: inherit;
       font-size: 13px; cursor: pointer; }
.btn.primary { border-color: var(--teal); }
/* The file type and its button wrap as one, so the choice never lands a line away from the action */
.dlg { display: inline-flex; gap: 6px; }

/* A document, not a dashboard: the slide is one vector drawing on a fixed 3180x1789 landscape
   canvas, scaled whole to the width it is given. It stays sharp at any zoom. */
.deck { max-width: 1800px; margin: 0 auto; padding: 24px 24px 64px; }
.page { display: block; width: 100%; height: auto; background: var(--white); border-radius: 10px;
        box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }

.embed body { background: transparent; }
.embed .bar { display: none; }
.embed .deck { max-width: none; padding: 0; }
.embed .page { border-radius: 0; box-shadow: none; }

/* Drawing styles. Nothing is set below 24 units. */
.page text { font-family: var(--franklin); font-size: 26px; fill: var(--ink); }
.page .h1 { font-size: 52px; fill: var(--title); }
.page .pill-t { fill: var(--white); font-weight: 700; font-size: 28px; text-anchor: middle; }
.page .zh { font-size: 28px; font-weight: 700; }
.page .zh tspan.it { font-weight: 400; font-style: italic; fill: var(--sub); }
.page .lane-t { font-size: 24px; font-weight: 700; fill: var(--purple); letter-spacing: .04em; }
.page .c { text-anchor: middle; }
.page .b { font-weight: 700; }
.page .s { fill: var(--sub); font-size: 24px; }
.page .hw { fill: var(--purple); font-size: 24px; }
.page .sock { fill: var(--sub); font-size: 24px; font-weight: 700; }
.page .code { font-family: var(--mono); font-size: 24px; fill: var(--teal); }
.page .yn { fill: var(--sub); font-size: 24px; font-style: italic; }
.page .lg { fill: var(--sub); font-size: 24px; }

.page .zone-ctx { fill: var(--purple-tint); }
.page .zone-focus { fill: var(--teal-tint); }
.page .spark { fill: var(--white); stroke: var(--purple); stroke-width: 2; }
.page .ueside { fill: var(--white); stroke: var(--card-line); stroke-width: 2; }
.page .lane-cpu { fill: var(--purple-tint); }
.page .lane-gpu { fill: var(--purple-tint); }
.page .card { fill: var(--white); stroke: var(--card-line); stroke-width: 1.8; }
.page .focal { fill: var(--white); stroke: var(--teal); stroke-width: 2.8; }
.page .mem, .page .port { fill: var(--white); stroke: var(--purple); stroke-width: 1.8; }
.page .strip { fill: var(--wire); }
.page .dec { fill: var(--white); stroke: var(--teal); stroke-width: 2.2; }
.page .num { fill: var(--teal); }
.page .num-t { fill: var(--white); font-weight: 700; font-size: 24px; text-anchor: middle; }
.page .disc { fill: var(--teal); }
.page .ico-w { fill: none; stroke: var(--white); stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
.page .data { stroke: var(--wire); stroke-width: 3; fill: none; }
.page .bi { marker-start: url(#ah); marker-end: url(#ah); }
.page .one { marker-end: url(#ah); }
.page .ctl { stroke: var(--wire); stroke-width: 2.4; stroke-dasharray: 8 6; fill: none; marker-end: url(#ah); }
.page .flow { stroke: var(--teal); stroke-width: 3; fill: none; marker-end: url(#at); }
.page .bits { font-family: var(--mono); font-size: 28px; fill: var(--ink); }
.page .gl text { font-family: var(--mono); font-size: 24px; fill: var(--ink); text-anchor: middle; }
/* The detailed view opens out of the Channel emulator block: a teal wash between two faint edges. */
.page .pv { fill: var(--teal); fill-opacity: .12; stroke: none; }
.page .pv-edge { stroke: var(--teal); stroke-opacity: .55; stroke-width: 2.4; fill: none; }
.page .grp { fill: none; stroke: var(--teal); stroke-width: 2; stroke-dasharray: 4 6; }
.page #ah path { fill: var(--wire); } .page #at path { fill: var(--teal); }

@page { size: 3180px 1789px; margin: 0; }
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { background: var(--white); }
  .bar { display: none; }
  .deck { max-width: none; padding: 0; }
  .page { width: 3180px; height: 1789px; border-radius: 0; box-shadow: none; }
}
@media screen and (max-width: 860px) {
  .bar { padding: 10px 16px; }
  .deck { padding: 16px 16px 48px; }
}
@media (pointer: coarse) {
  .btn { min-height: 40px; }
}
</style>
</head>

  <span class="name">Channel Emulator Brief · Ruibin's ideal version</span>
  <span class="sp"></span>
  <a class="btn" href="/spark/brief">Original layout</a>
  <a class="btn" href="/spark/">Dashboard</a>
  <span class="dlg"><select class="btn" id="fmt" aria-label="File type"><option value="pdf">.pdf</option><option value="pptx">.pptx</option></select>
  <button class="btn primary" id="dl" type="button">Download</button></span>
</div>

<main class="deck">
<svg class="page" viewBox="0 0 3180 1789" role="img" aria-label="Sionna RT channel emulator on NVIDIA DGX Spark, Ruibin's layout. Top, across the page: the system. On the GB10's Arm CPU, two OCUDU DUs connect through ZMQ sockets to the IQ broker. Each IQ block passes through 128 GB of unified memory over NVLink-C2C to the channel emulator on the GPU, which also takes live taps from a publisher on port 5566. A 10 GbE port carries the core. Outside the Spark, the IQ broker connects through ZMQ sockets to two OAI UEs in namespaces ue1 and ue2, which feed the UE broker for multipath TCP. The GPU's channel emulator opens out into a shaded detailed view: the emulator loop below. Lower left: the emulator loop as a flowchart, every 0.5 ms slot: pull 30,720 IQ samples with REQ; if new live taps arrived from SUB 5566, swap them in; otherwise build taps with tr38901.TDL, the 3GPP tapped-delay-line model, which gives path gains a and delays tau, and sample them with cir_to_time_channel; the tap building and swapping form the channel generation and update stage; filter with ApplyTimeChannel; add AWGN, additive white Gaussian noise, and bias; return the same 30,720 samples with REP; repeat for the next slot. Lower right: Sionna RT. A scene loaded with load_scene and the path solver PathSolver()(scene) run outside the slot loop; the channel parameters from Paths.cir, path gains a and delays tau, replace step 2, the TDL taps, and feed the emulator's channel generation and update stage.">

<script src="/spark/slide-pptx.js"></script>
<script>
  // .pdf prints the page, which the print stylesheet sizes to the slide; .pptx rebuilds it as editable shapes.
  document.getElementById('dl').addEventListener('click', function () {
    var btn = this;
    if (document.getElementById('fmt').value !== 'pptx') return window.print();
    var name = location.pathname.split('/').pop() || 'brief';
    btn.disabled = true; btn.textContent = 'Building…';
    slidePptx.download(document.querySelector('svg.page'), name + '.pptx')
      .catch(function (e) { alert('The .pptx could not be built: ' + e.message); })
      .then(function () { btn.disabled = false; btn.textContent = 'Download'; });
  });
</script>
